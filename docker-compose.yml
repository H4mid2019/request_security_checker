
services:
  security_app:
    build:
      context: ./go_security_app
      dockerfile: Dockerfile
    command: '/app/security-app'
    network_mode: host
    restart: unless-stopped
    environment:
      - PORT=5000
      - REDIS_ADDR=localhost:6379
    depends_on:
      redis:
        condition: service_healthy


  redis:
    image: redis:latest
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
